# Render Blueprint for the ArtistOS API (Express). The Next.js frontend stays on Vercel.
services:
  - type: web
    name: artistos-api
    runtime: node
    rootDir: server
    # Starter or above: the free plan sleeps after ~15 min idle (bad for webhooks/cron).
    plan: starter
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: false
    domains:
      - api.artistos.in
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: COOKIE_DOMAIN
        value: .artistos.in
      - key: FRONTEND_ORIGINS
        value: https://www.artistos.in
      - key: APP_URL
        value: https://www.artistos.in
      # Secrets: set in the Render dashboard (sync: false keeps them out of this file).
      # JWT_SECRET must match the Vercel value exactly.
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
