name: Cron Jobs

on:
  schedule:
    - cron: '*/5 * * * *' # scan-bookings
    - cron: '*/2 * * * *' # dispatch
    - cron: '0 3 * * *'   # expire-shares
  workflow_dispatch:

jobs:
  scan-bookings:
    name: Scan Bookings
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger Scan Bookings API
        run: |
          set -euo pipefail
          : "${APP_URL:?APP_URL secret is required}"
          : "${CRON_SECRET:?CRON_SECRET secret is required}"
          base_url="${APP_URL%/}"

          curl --request GET --fail-with-body --show-error --silent --location \
            "$base_url/api/cron/notifications/scan-bookings" \
            --header "Authorization: Bearer $CRON_SECRET"

  dispatch:
    name: Dispatch Notifications
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/2 * * * *'
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger Dispatch API
        run: |
          set -euo pipefail
          : "${APP_URL:?APP_URL secret is required}"
          : "${CRON_SECRET:?CRON_SECRET secret is required}"
          base_url="${APP_URL%/}"

          curl --request GET --fail-with-body --show-error --silent --location \
            "$base_url/api/cron/notifications/dispatch" \
            --header "Authorization: Bearer $CRON_SECRET"

  expire-shares:
    name: Expire Shares
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger Expire Shares API
        run: |
          set -euo pipefail
          : "${APP_URL:?APP_URL secret is required}"
          : "${CRON_SECRET:?CRON_SECRET secret is required}"
          base_url="${APP_URL%/}"

          curl --request GET --fail-with-body --show-error --silent --location \
            "$base_url/api/cron/portfolio/expire-shares" \
            --header "Authorization: Bearer $CRON_SECRET"
